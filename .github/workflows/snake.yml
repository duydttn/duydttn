name: Generate Snake

# Con rắn sẽ được vẽ lại mỗi 24h hoặc khi bạn bấm nút chạy thủ công
on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Sử dụng action của Platane để tạo file SVG
      # Tôi đã chỉnh palette màu cho hợp với theme của bạn:
      # Nền tối xanh, các ô commit từ xanh nhạt đến xanh đậm, và rắn màu vàng rực.
      - name: generate-snake-game-from-github-contribution-grid
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#f7df1e&color_dots=#1a1b26,#314f7a,#4883c2,#5eaaff,#f7df1e

      # Đẩy file SVG vừa tạo vào nhánh tên là 'output'
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
